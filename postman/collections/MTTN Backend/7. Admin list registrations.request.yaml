$kind: http-request
url: "{{baseUrl}}/api/admin/registrations"
method: GET
headers:
  X-Admin-Key: "{{adminKey}}"
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code === 200) {
        const j = pm.response.json();
        if (j.registrations && j.registrations.length) pm.collectionVariables.set('reg_id', j.registrations[0].id);
      }
    language: text/javascript
order: 7000
