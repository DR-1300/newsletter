$kind: http-request
url: "{{baseUrl}}/subscribe"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: '{"email": "{{sub_email}}"}'
scripts:
  - type: afterResponse
    code: pm.test('status is 409', () => pm.response.to.have.status(409));
    language: text/javascript
order: 14000
