$kind: http-request
url: "{{baseUrl}}/subscribe"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: '{"email": "{{sub_email}}"}'
scripts:
  - type: beforeRequest
    code: pm.collectionVariables.set('sub_email', 'postman' + Date.now() + '@example.com');
    language: text/javascript
  - type: afterResponse
    code: pm.test('status is 201', () => pm.response.to.have.status(201));
    language: text/javascript
order: 13000
