$kind: http-request
url: "{{baseUrl}}/articles"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: '{"slug": "{{rand_slug}}", "title": "Posted from Postman", "description": "Testing the create route", "contents": {"type": "doc", "content": [{"type": "paragraph", "content": [{"type": "text", "text": "Created through Postman"}]}]}, "tags": ["postman", "test"], "category_id": "{{category_id}}", "status": "published", "type": "newsletter", "estimated_read_time": 2}'
scripts:
  - type: beforeRequest
    code: pm.variables.set('rand_slug', 'postman-' + Date.now());
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('status is 201', () => pm.response.to.have.status(201));
      if (pm.response.code === 201) {
        const j = pm.response.json();
        pm.collectionVariables.set('article_id', j.id);
        pm.collectionVariables.set('article_slug', j.slug);
      }
    language: text/javascript
order: 5000
